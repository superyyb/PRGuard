apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-datasource
  namespace: prguard
data:
  datasource.yml: |
    apiVersion: 1
    datasources:
      - name: Prometheus
        type: prometheus
        access: proxy
        url: http://prometheus-service:9090
        isDefault: true
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-provider
  namespace: prguard
data:
  dashboard.yml: |
    apiVersion: 1
    providers:
      - name: prguard
        folder: PRGuard
        type: file
        updateIntervalSeconds: 30
        options:
          path: /etc/grafana/provisioning/dashboards
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-prguard
  namespace: prguard
data:
  prguard.json: |
    {
      "title": "PRGuard Pipeline Latency",
      "uid": "prguard-latency",
      "schemaVersion": 39,
      "timezone": "browser",
      "time": { "from": "now-6h", "to": "now" },
      "refresh": "30s",
      "panels": [
        {
          "id": 1,
          "title": "Stage latency (p50 / p95 / p99)",
          "type": "timeseries",
          "gridPos": { "h": 9, "w": 24, "x": 0, "y": 0 },
          "datasource": { "type": "prometheus", "uid": "Prometheus" },
          "fieldConfig": { "defaults": { "unit": "s" }, "overrides": [] },
          "targets": [
            { "expr": "histogram_quantile(0.5, sum(rate(pr_stage_duration_seconds_bucket[5m])) by (le, service, stage))", "legendFormat": "{{service}}/{{stage}} p50" },
            { "expr": "histogram_quantile(0.95, sum(rate(pr_stage_duration_seconds_bucket[5m])) by (le, service, stage))", "legendFormat": "{{service}}/{{stage}} p95" },
            { "expr": "histogram_quantile(0.99, sum(rate(pr_stage_duration_seconds_bucket[5m])) by (le, service, stage))", "legendFormat": "{{service}}/{{stage}} p99" }
          ]
        },
        {
          "id": 2,
          "title": "Stage error count (last 1h)",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 9 },
          "datasource": { "type": "prometheus", "uid": "Prometheus" },
          "fieldConfig": { "defaults": { "unit": "short" }, "overrides": [] },
          "targets": [
            { "expr": "sum(increase(pr_stage_total{outcome=\"error\"}[1h])) by (service, stage)", "legendFormat": "{{service}}/{{stage}}" }
          ]
        },
        {
          "id": 3,
          "title": "DLQ messages (last 1h)",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 9 },
          "datasource": { "type": "prometheus", "uid": "Prometheus" },
          "fieldConfig": { "defaults": { "unit": "short" }, "overrides": [] },
          "targets": [
            { "expr": "sum(increase(dlq_messages_total[1h])) by (error_type)", "legendFormat": "{{error_type}}" }
          ]
        }
      ]
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
  namespace: prguard
spec:
  replicas: 1
  selector:
    matchLabels:
      app: grafana
  template:
    metadata:
      labels:
        app: grafana
    spec:
      containers:
        - name: grafana
          image: grafana/grafana:11.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
          env:
            - name: GF_AUTH_ANONYMOUS_ENABLED
              value: "true"
            - name: GF_AUTH_ANONYMOUS_ORG_ROLE
              value: Admin
          resources:
            requests:
              cpu: "50m"
              memory: "128Mi"
            limits:
              cpu: "300m"
              memory: "256Mi"
          volumeMounts:
            - name: datasource
              mountPath: /etc/grafana/provisioning/datasources
            - name: dashboard-provider
              mountPath: /etc/grafana/provisioning/dashboards/dashboard.yml
              subPath: dashboard.yml
            - name: dashboard-prguard
              mountPath: /etc/grafana/provisioning/dashboards/prguard.json
              subPath: prguard.json
      volumes:
        - name: datasource
          configMap:
            name: grafana-datasource
        - name: dashboard-provider
          configMap:
            name: grafana-dashboard-provider
        - name: dashboard-prguard
          configMap:
            name: grafana-dashboard-prguard
---
apiVersion: v1
kind: Service
metadata:
  name: grafana-service
  namespace: prguard
spec:
  selector:
    app: grafana
  ports:
    - port: 3000
      targetPort: 3000
