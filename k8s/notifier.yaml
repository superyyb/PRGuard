apiVersion: apps/v1
kind: Deployment
metadata:
  name: notifier
  namespace: prguard
spec:
  replicas: 1
  selector:
    matchLabels:
      app: notifier
  template:
    metadata:
      labels:
        app: notifier
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9100"
    spec:
      containers:
        - name: notifier
          image: githubautomation-notifier:latest
          imagePullPolicy: Never
          env:
            - name: KAFKA_BOOTSTRAP_SERVERS
              valueFrom:
                configMapKeyRef:
                  name: prguard-config
                  key: KAFKA_BOOTSTRAP_SERVERS
            - name: GMAIL_USER
              valueFrom:
                secretKeyRef:
                  name: prguard-secrets
                  key: GMAIL_USER
            - name: GMAIL_APP_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: prguard-secrets
                  key: GMAIL_APP_PASSWORD
            - name: NOTIFY_EMAIL
              valueFrom:
                secretKeyRef:
                  name: prguard-secrets
                  key: NOTIFY_EMAIL
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: prguard-secrets
                  key: DATABASE_URL
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: "http://jaeger-service:4318"
          livenessProbe:
            exec:
              # 检查 /tmp/healthy 在 120 秒内是否被更新过
              # 只有真的持有 partition 分配时才会更新，consumer 卡在 rejoin group 时探针会失败并触发重启
              command:
                - /bin/sh
                - -c
                - "test $(( $(date +%s) - $(stat -c %Y /tmp/healthy) )) -lt 120"
            initialDelaySeconds: 15
            periodSeconds: 30
            failureThreshold: 3
          readinessProbe:
            exec:
              # 检查 /tmp/ready 是否存在，存在说明已成功订阅 Kafka topic
              command: ["cat", "/tmp/ready"]
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 3
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "200m"
              memory: "256Mi"
