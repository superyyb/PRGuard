apiVersion: v1
kind: ServiceAccount
metadata:
  name: prometheus
  namespace: prguard
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: prometheus
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: prometheus
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: prometheus
subjects:
  - kind: ServiceAccount
    name: prometheus
    namespace: prguard
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: prguard
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s

    rule_files:
      - alerts.yml

    alerting:
      alertmanagers:
        - static_configs:
            - targets: ["alertmanager-service:9093"]

    scrape_configs:
      # Pod 级服务发现：不走 Service，直接命中每个 Pod IP，
      # 这样 KEDA 把 ai-review-worker 弹到多副本时每个副本都能被单独抓到
      - job_name: prguard-pods
        kubernetes_sd_configs:
          - role: pod
            namespaces:
              names: ["prguard"]
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scrape]
            action: keep
            regex: "true"
          - source_labels: [__address__, __meta_kubernetes_pod_annotation_prometheus_io_port]
            action: replace
            regex: ([^:]+)(?::\d+)?;(\d+)
            replacement: $1:$2
            target_label: __address__
          - source_labels: [__meta_kubernetes_pod_label_app]
            target_label: app
          - source_labels: [__meta_kubernetes_pod_name]
            target_label: pod
  alerts.yml: |
    groups:
      - name: dlq
        rules:
          - alert: DLQPermanentFailureBurst
            expr: increase(dlq_messages_total{error_type="PermanentFailure"}[10m]) > 3
            for: 0m
            labels:
              severity: warning
            annotations:
              summary: "{{ $labels.service }} 短时间内出现多条永久失败消息"
              description: "10分钟内 {{ $value }} 条 PermanentFailure，可能是事件 schema 变更或版本 skew"

          - alert: DLQTemporaryFailureExhausted
            expr: increase(dlq_messages_total{error_type="TemporaryFailure"}[5m]) > 0
            for: 0m
            labels:
              severity: critical
            annotations:
              summary: "{{ $labels.service }} 重试耗尽，疑似外部依赖故障"
              description: "{{ $labels.service }} 有消息重试3次后仍失败，可能是 Claude/GitHub API 或 SMTP 出问题"
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: prometheus-pvc
  namespace: prguard
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
  namespace: prguard
spec:
  replicas: 1
  selector:
    matchLabels:
      app: prometheus
  template:
    metadata:
      labels:
        app: prometheus
    spec:
      serviceAccountName: prometheus
      containers:
        - name: prometheus
          image: prom/prometheus:v2.53.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 9090
          volumeMounts:
            - name: config
              mountPath: /etc/prometheus/prometheus.yml
              subPath: prometheus.yml
            - name: config
              mountPath: /etc/prometheus/alerts.yml
              subPath: alerts.yml
            - name: prometheus-data
              mountPath: /prometheus
          resources:
            requests:
              cpu: "50m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
      volumes:
        - name: config
          configMap:
            name: prometheus-config
        - name: prometheus-data
          persistentVolumeClaim:
            claimName: prometheus-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: prometheus-service
  namespace: prguard
spec:
  selector:
    app: prometheus
  ports:
    - port: 9090
      targetPort: 9090
