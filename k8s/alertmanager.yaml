apiVersion: v1
kind: ConfigMap
metadata:
  name: alertmanager-config
  namespace: prguard
data:
  alertmanager.yml.tmpl: |
    global:
      smtp_from: '__GMAIL_USER__'
      smtp_smarthost: 'smtp.gmail.com:587'
      smtp_auth_username: '__GMAIL_USER__'
      smtp_auth_password: '__GMAIL_APP_PASSWORD__'
      smtp_require_tls: true

    route:
      receiver: email
      group_by: ['alertname', 'service']
      group_wait: 30s
      group_interval: 5m
      repeat_interval: 4h

    receivers:
      - name: email
        email_configs:
          - to: '__NOTIFY_EMAIL__'
            send_resolved: true
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: alertmanager
  namespace: prguard
spec:
  replicas: 1
  selector:
    matchLabels:
      app: alertmanager
  template:
    metadata:
      labels:
        app: alertmanager
    spec:
      containers:
        - name: alertmanager
          image: prom/alertmanager:v0.27.0
          imagePullPolicy: IfNotPresent
          env:
            - name: GMAIL_USER
              valueFrom:
                secretKeyRef:
                  name: prguard-secrets
                  key: GMAIL_USER
            - name: GMAIL_APP_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: prguard-secrets
                  key: GMAIL_APP_PASSWORD
            - name: NOTIFY_EMAIL
              valueFrom:
                secretKeyRef:
                  name: prguard-secrets
                  key: NOTIFY_EMAIL
          command: ["/bin/sh", "-c"]
          args:
            - |
              sed -e "s|__GMAIL_USER__|$GMAIL_USER|g" \
                  -e "s|__GMAIL_APP_PASSWORD__|$GMAIL_APP_PASSWORD|g" \
                  -e "s|__NOTIFY_EMAIL__|$NOTIFY_EMAIL|g" \
                  /etc/alertmanager/alertmanager.yml.tmpl > /tmp/alertmanager.yml &&
              exec /bin/alertmanager --config.file=/tmp/alertmanager.yml --storage.path=/alertmanager
          ports:
            - containerPort: 9093
          volumeMounts:
            - name: config
              mountPath: /etc/alertmanager/alertmanager.yml.tmpl
              subPath: alertmanager.yml.tmpl
          resources:
            requests:
              cpu: "25m"
              memory: "32Mi"
            limits:
              cpu: "100m"
              memory: "128Mi"
      volumes:
        - name: config
          configMap:
            name: alertmanager-config
---
apiVersion: v1
kind: Service
metadata:
  name: alertmanager-service
  namespace: prguard
spec:
  selector:
    app: alertmanager
  ports:
    - port: 9093
      targetPort: 9093
