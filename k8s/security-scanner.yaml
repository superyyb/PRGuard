apiVersion: apps/v1
kind: Deployment
metadata:
  name: security-scanner
  namespace: prguard
spec:
  replicas: 1
  selector:
    matchLabels:
      app: security-scanner
  template:
    metadata:
      labels:
        app: security-scanner
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9100"
    spec:
      containers:
        - name: security-scanner
          image: githubautomation-security-scanner:latest
          imagePullPolicy: Never
          env:
            - name: KAFKA_BOOTSTRAP_SERVERS
              valueFrom:
                configMapKeyRef:
                  name: prguard-config
                  key: KAFKA_BOOTSTRAP_SERVERS
            - name: GITHUB_TOKEN
              valueFrom:
                secretKeyRef:
                  name: prguard-secrets
                  key: GITHUB_TOKEN
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: "http://jaeger-service:4318"
          livenessProbe:
            exec:
              # 检查 /tmp/healthy 在 120 秒内是否被更新过
              # 只有真的持有 partition 分配时才会更新，consumer 卡在 rejoin group 时探针会失败并触发重启
              command:
                - /bin/sh
                - -c
                - "test $(( $(date +%s) - $(stat -c %Y /tmp/healthy) )) -lt 120"
            initialDelaySeconds: 15
            periodSeconds: 30
            failureThreshold: 3
          readinessProbe:
            exec:
              # 检查 /tmp/ready 是否存在，存在说明已成功订阅 Kafka topic
              command: ["cat", "/tmp/ready"]
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 3
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "200m"
              memory: "256Mi"
